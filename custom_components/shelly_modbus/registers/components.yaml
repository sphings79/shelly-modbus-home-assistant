# Shelly Gen2+ Modbus component register maps.
#
# All values are exposed by the device as INPUT REGISTERS (function code 0x04).
#
# IMPORTANT - address translation:
#   The Shelly documentation lists addresses in the classic "3xxxx" input-register
#   notation (e.g. 31020 for EM phase A voltage).  The address actually put on the
#   wire is that number MINUS 30000, so 31020 is read as input register 1020.
#   The `base` values below are already wire addresses.
#   Verified on a Shelly Pro 3EM (SPEM-003CEBEU, fw 2.0.0) and a Shelly 3EM-63 Gen3
#   (S3EM-003CXCEU63, fw 2.0.0).
#
# Encoding (verified against the devices' own RPC values):
#   float   - 32 bit IEEE754 across 2 registers, LOW word first (CDAB word swap)
#   uint32  - 32 bit unsigned across 2 registers, LOW word first
#   boolean - single register, 0 / 1
#   char    - ASCII, 2 bytes per register, byte-swapped within each register
#
# `offset` is relative to the component instance base address.  A component
# instance's base is `base + id * stride`.

device:
  base: 0
  stride: 0
  fields:
    mac:
      offset: 0
      count: 6
      data_type: char
      name: MAC Address
      icon: "mdi:network-outline"
      category: diagnostic
      enabled_by_default: false
      scan_interval: static
    model:
      offset: 6
      count: 10
      data_type: char
      name: Model
      icon: "mdi:package-variant-closed"
      category: diagnostic
      enabled_by_default: false
      scan_interval: static
    device_name:
      offset: 16
      count: 32
      data_type: char
      name: Device Name
      icon: "mdi:rename-outline"
      category: diagnostic
      enabled_by_default: false
      scan_interval: static

