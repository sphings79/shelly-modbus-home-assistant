# Shelly device models that expose a Modbus-TCP server, and the component
# instances each one publishes.
#
# `model` keys are the exact strings the device reports in input registers 6..15
# (documented address 30006), so a connected device can be identified
# automatically.  Model codes follow the official Shelly product identifiers.
#
# Devices whose measuring profile can be switched (the 3-phase energy meters can
# run as one 3-phase meter or as three independent single-phase meters) declare
# one entry per profile.  Which profile is active is detected by probing, and
# can be overridden manually during setup.

models:
  SPEM-003CEBEU:
    name: Shelly Pro 3EM
    gen: 2
    default_profile: triphase
    profiles:
      triphase:
        components:
          - {type: em, id: 0}
          - {type: emdata, id: 0}
      monophase:
        components:
          - {type: em1, id: 0}
          - {type: em1, id: 1}
          - {type: em1, id: 2}
          - {type: em1data, id: 0}
          - {type: em1data, id: 1}
          - {type: em1data, id: 2}

