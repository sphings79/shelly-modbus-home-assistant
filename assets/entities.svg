<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" role="img" aria-label="Illustration of the entities created for a Shelly Pro 3EM">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .card{fill:#1C1C1C;stroke:#2E2E2E;stroke-width:1}
    .row{fill:#202020}
    .name{font-size:13.5px;fill:#E1E1E1}
    .eid{font-size:11px;fill:#6E6E6E}
    .val{font-size:14.5px;font-weight:600;fill:#E1E1E1}
    .head{font-size:11px;font-weight:700;fill:#8A8A8A;letter-spacing:.09em}
    .title{font-size:18px;font-weight:600;fill:#E1E1E1}
    .sub{font-size:12.5px;fill:#9B9B9B}
    .chip{font-size:10.5px;font-weight:600}
  </style>
  <rect width="1160" height="620" rx="16" fill="#111111"/>
  <text x="34" y="36" class="t" font-size="14" fill="#6E6E6E">Illustration · Entities created for a Shelly Pro 3EM (triphase)</text>

  <g transform="translate(34,56)">
    <rect width="1092" height="540" rx="12" class="card"/>

    <!-- device header -->
    <text x="28" y="44" class="t title">Hauptsicherung</text>
    <text x="28" y="70" class="t sub">Shelly · Shelly Pro 3EM · local polling over Modbus-TCP</text>
    <g transform="translate(880,26)">
      <rect width="184" height="28" rx="14" fill="#3DDC97" fill-opacity=".14" stroke="#3DDC97" stroke-opacity=".4"/>
      <circle cx="20" cy="14" r="5" fill="#3DDC97"/>
      <text x="36" y="18" class="t chip" fill="#86E9BE">Modbus connected</text>
    </g>

    <line x1="28" y1="92" x2="1064" y2="92" stroke="#2E2E2E"/>
    <text x="28" y="118" class="t head">ENTITY</text>
    <text x="1064" y="118" class="t head" text-anchor="end">STATE</text>

    <g transform="translate(0,132)">
      <!-- rows -->
      <g>
        <rect x="28" y="0" width="1036" height="46" rx="7" class="row"/>
        <text x="46" y="21" class="t name">Total Active Power</text>
        <text x="46" y="37" class="t mono eid">sensor.hauptsicherung_total_active_power</text>
        <text x="1046" y="30" class="t val" text-anchor="end">21.1 W</text>
      </g>
      <g transform="translate(0,54)">
        <rect x="28" y="0" width="1036" height="46" rx="7" class="row"/>
        <text x="46" y="21" class="t name">Phase A Voltage</text>
        <text x="46" y="37" class="t mono eid">sensor.hauptsicherung_phase_a_voltage</text>
        <text x="1046" y="30" class="t val" text-anchor="end">240.4 V</text>
      </g>
      <g transform="translate(0,108)">
        <rect x="28" y="0" width="1036" height="46" rx="7" class="row"/>
        <text x="46" y="21" class="t name">Phase A Current</text>
        <text x="46" y="37" class="t mono eid">sensor.hauptsicherung_phase_a_current</text>
        <text x="1046" y="30" class="t val" text-anchor="end">1.482 A</text>
      </g>
      <g transform="translate(0,162)">
        <rect x="28" y="0" width="1036" height="46" rx="7" class="row"/>
        <text x="46" y="21" class="t name">Phase B Active Power</text>
        <text x="46" y="37" class="t mono eid">sensor.hauptsicherung_phase_b_active_power</text>
        <text x="1046" y="30" class="t val" text-anchor="end">21.9 W</text>
      </g>
      <g transform="translate(0,216)">
        <rect x="28" y="0" width="1036" height="46" rx="7" class="row"/>
        <text x="46" y="21" class="t name">Total Active Energy</text>
        <text x="46" y="37" class="t mono eid">sensor.hauptsicherung_total_active_energy</text>
        <text x="1046" y="30" class="t val" text-anchor="end">6388.570 kWh</text>
      </g>
      <g transform="translate(0,270)">
        <rect x="28" y="0" width="1036" height="46" rx="7" class="row"/>
        <text x="46" y="21" class="t name">Total Active Returned Energy</text>
        <text x="46" y="37" class="t mono eid">sensor.hauptsicherung_total_active_returned_energy</text>
        <text x="1046" y="30" class="t val" text-anchor="end">6382.640 kWh</text>
      </g>
      <g transform="translate(0,324)">
        <rect x="28" y="0" width="1036" height="46" rx="7" class="row"/>
        <text x="46" y="21" class="t name">Phase A Active Energy</text>
        <text x="46" y="37" class="t mono eid">sensor.hauptsicherung_phase_a_active_energy</text>
        <text x="1046" y="30" class="t val" text-anchor="end">2793.668 kWh</text>
      </g>
    </g>
  </g>
</svg>
