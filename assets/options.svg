<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" width="660" height="430" role="img" aria-label="Illustration of the polling interval options">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .card{fill:#1C1C1C;stroke:#2E2E2E;stroke-width:1}
    .field{fill:#252525;stroke:#3A3A3A;stroke-width:1}
    .title{font-size:19px;font-weight:600;fill:#E1E1E1}
    .desc{font-size:12.5px;fill:#9B9B9B}
    .lab{font-size:11px;fill:#03A9F4}
    .val{font-size:14px;fill:#E1E1E1}
    .unit{font-size:13px;fill:#7A7A7A}
    .btn{fill:#03A9F4}
    .btnt{font-size:13px;font-weight:600;fill:#0B1B2B}
  </style>
  <rect width="660" height="430" rx="16" fill="#111111"/>
  <text x="30" y="36" class="t" font-size="14" fill="#6E6E6E">Illustration · Integration options</text>

  <g transform="translate(30,56)">
    <rect width="600" height="344" rx="12" class="card"/>
    <text x="28" y="46" class="t title">Shelly Modbus options</text>
    <text x="28" y="76" class="t desc">Polling intervals per category. Fast values are power,</text>
    <text x="28" y="96" class="t desc">voltage and current; slow values are energy counters</text>
    <text x="28" y="116" class="t desc">and error flags.</text>

    <rect x="28" y="142" width="544" height="58" rx="6" class="field"/>
    <text x="44" y="164" class="t lab">Fast values interval (seconds)</text>
    <text x="44" y="186" class="t val">10</text>
    <text x="544" y="186" class="t unit" text-anchor="end">s</text>

    <rect x="28" y="214" width="544" height="58" rx="6" class="field"/>
    <text x="44" y="236" class="t lab">Slow values interval (seconds)</text>
    <text x="44" y="258" class="t val">60</text>
    <text x="544" y="258" class="t unit" text-anchor="end">s</text>

    <rect x="456" y="290" width="116" height="40" rx="20" class="btn"/>
    <text x="514" y="315" class="t btnt" text-anchor="middle">Submit</text>
  </g>
</svg>
